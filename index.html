	<!-- 强制横屏（原生方向锁定 + 竖屏提示兜底，不旋转 canvas 以免 Godot 触摸坐标错位）-->
	<style>
	#orient-hint{display:none;position:fixed;inset:0;z-index:99999;background:#0b0b10;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center;padding:24px;}
	#orient-hint .oh-phone{width:58px;height:100px;border:3px solid #fff;border-radius:10px;position:relative;animation:oh-rotate 2.2s ease-in-out infinite;transform-origin:center;}
	#orient-hint .oh-phone::after{content:"";position:absolute;left:50%;bottom:7px;width:16px;height:3px;background:#fff;border-radius:2px;transform:translateX(-50%);opacity:.55;}
	@keyframes oh-rotate{0%,18%{transform:rotate(0)}48%,86%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
	#orient-hint .oh-title{font-size:19px;font-weight:600;letter-spacing:1px;}
	#orient-hint .oh-sub{font-size:13px;color:#9aa0b4;line-height:1.7;max-width:300px;}
	#oh-btn{margin-top:4px;border:0;border-radius:999px;padding:11px 26px;font-size:15px;font-weight:600;color:#111;background:#ffd54a;touch-action:manipulation;cursor:pointer;}
	#oh-skip{margin-top:2px;font-size:12px;color:#6d7385;text-decoration:underline;background:none;border:0;touch-action:manipulation;cursor:pointer;}
	</style>
	<div id="orient-hint">
		<div class="oh-phone"></div>
		<div class="oh-title">请横屏游玩</div>
		<div class="oh-sub">把手机横过来，或点击下方按钮进入全屏横屏</div>
		<button id="oh-btn" type="button">全屏横屏进入</button>
		<button id="oh-skip" type="button">仍要竖屏继续</button>
	</div>
	<script>
	(function(){
		var overlay = document.getElementById('orient-hint');
		var btn = document.getElementById('oh-btn');
		var skipBtn = document.getElementById('oh-skip');
		var isMobile = false;
		try { isMobile = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0; } catch(e) {}
		if (!isMobile) { overlay.style.display = 'none'; return; }

		var skipped = false, busy = false;
		function isPortrait(){
			try { return window.matchMedia('(orientation: portrait)').matches; }
			catch(e) { return window.innerHeight > window.innerWidth; }
		}
		function refresh(){
			var show = isPortrait() && !skipped;
			overlay.style.display = show ? 'flex' : 'none';
		}
		function tryLock(){
			var so = window.screen && window.screen.orientation;
			if (!so || typeof so.lock !== 'function') return;
			if (!document.fullscreenElement) return;
			try { so.lock('landscape').catch(function(){}); } catch(e) {}
		}
		function enter(){
			if (busy) return;
			busy = true;
			var el = document.documentElement, p;
			try {
				if (el.requestFullscreen) p = el.requestFullscreen();
				else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); p = null; }
			} catch(e) { p = null; }
			Promise.resolve(p).catch(function(){}).then(function(){
				tryLock();
				setTimeout(function(){ busy = false; refresh(); }, 350);
			});
		}
		btn.addEventListener('click', function(e){ e.preventDefault(); enter(); });
		overlay.addEventListener('touchstart', function(e){ if (e.target === skipBtn) return; enter(); }, {passive:true});
		skipBtn.addEventListener('click', function(e){ e.preventDefault(); skipped = true; refresh(); });

		window.addEventListener('resize', refresh);
		window.addEventListener('orientationchange', refresh);
		try { if (window.screen.orientation && window.screen.orientation.addEventListener) window.screen.orientation.addEventListener('change', refresh); } catch(e) {}
		document.addEventListener('fullscreenchange', function(){ tryLock(); refresh(); });
		document.addEventListener('webkitfullscreenchange', function(){ tryLock(); refresh(); });
		document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(); });

		refresh();
	})();
	</script>
